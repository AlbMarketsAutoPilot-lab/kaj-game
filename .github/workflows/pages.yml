name: Web

# Publishes the game (dist/kaj.html as index.html) on GitHub Pages after each merge to main.
# Link: https://albmarketsautopilot-lab.github.io/kaj-game/
# Privacy policy (Google Play, task 15): https://albmarketsautopilot-lab.github.io/kaj-game/privacy.html
# Copyright page (shown in the app too): https://albmarketsautopilot-lab.github.io/kaj-game/copyright.html
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build the game (dist/kaj.html)
        run: npm run build
      - name: Prepare the site
        run: mkdir site && cp dist/kaj.html site/index.html && cp web/privacy.html site/privacy.html && cp web/copyright.html site/copyright.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
